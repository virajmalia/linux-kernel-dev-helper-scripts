name: Build Linux Kernel

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build (e.g., v6.6, v5.15.1)'
        required: false
        default: 'v6.6'
      build_type:
        description: 'Build type (full, modules, bzImage)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - modules
          - bzImage

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        # You can add more architectures for cross-compilation
        # arch: [x86_64, arm64, riscv64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            git fakeroot ncurses-dev xz-utils bc rsync curl wget \
            gcc-multilib gawk python3 python3-pip kmod cpio \
            gcc make git bc libssl-dev rsync \
            qemu-system-x86 qemu-utils

      - name: Set up environment
        run: |
          mkdir -p /kernel-build
          chmod +x ./scripts/setup.sh
          chmod +x ./scripts/build-kernel.sh
          chmod +x ./scripts/test-kernel.sh

      - name: Set kernel version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.kernel_version }}" ]; then
            echo "KERNEL_VERSION=${{ github.event.inputs.kernel_version }}" >> $GITHUB_ENV
          else
            echo "KERNEL_VERSION=v6.6" >> $GITHUB_ENV
          fi

      - name: Set build type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.build_type }}" ]; then
            echo "BUILD_TYPE=${{ github.event.inputs.build_type }}" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=full" >> $GITHUB_ENV
          fi

      - name: Run setup script
        run: |
          ./scripts/setup.sh
          source /workspace/.env.kernel

      - name: Build kernel
        run: |
          ./scripts/build-kernel.sh --version ${{ env.KERNEL_VERSION }} --type ${{ env.BUILD_TYPE }} --clean

      - name: Build example kernel module
        run: |
          cd src/kernel-module-example
          make KERNEL_SRC=/usr/src/linux KBUILD_OUTPUT=/kernel-build

      - name: Run static analysis tests
        run: |
          ./scripts/test-kernel.sh static-analysis

      - name: Archive kernel artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-build-${{ env.KERNEL_VERSION }}-${{ matrix.arch }}
          path: |
            /kernel-build/arch/${{ matrix.arch }}/boot/bzImage
            /kernel-build/*.deb
            /kernel-build/*.rpm
          retention-days: 7
          if-no-files-found: ignore